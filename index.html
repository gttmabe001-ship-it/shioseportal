<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>塩瀬中ポータル連絡掲示板</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* 全体に可読性の高いUDフォント（ユニバーサルデザインフォント）を優先指定 */
    body {
      font-family: "BIZ UDPGothic", "BIZ UDPゴシック", "UD Shin Go", "UD 新ゴ", "Meiryo UI", "Meiryo", "Hiragino Kaku Gothic ProN", sans-serif;
    }
    /* スクロールバーのカスタマイズ */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <div id="app" class="max-w-4xl mx-auto p-3">
    <!-- 接続状態インジケーター & リロードボタン -->
    <div id="connection-status" class="text-right text-[9px] text-slate-400 mb-1 flex items-center justify-end gap-2">
      <div class="flex items-center gap-1">
        <span class="inline-block w-2 h-2 rounded-full bg-slate-300 animate-pulse" id="status-dot"></span>
        <span id="status-text">データベースに接続中...</span>
      </div>
      <button onclick="fetchDataFromGAS()" class="flex items-center gap-0.5 px-1.5 py-0.5 bg-white border border-slate-200 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded transition" title="最新の情報に更新">
        <i data-lucide="refresh-cw" class="w-2.5 h-2.5" id="refresh-icon-spin"></i> 再読込
      </button>
    </div>

    <!-- ヘッダー -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 bg-white p-4 rounded-lg shadow-sm border border-slate-100 mb-3">
      <div>
        <h1 class="text-lg font-bold text-slate-900 flex items-center gap-1.5">
          <!-- 学校マークアイコン -->
          <i data-lucide="school" class="text-blue-600 w-5 h-5"></i> 
          <!-- 掲示板の名前（スプレッドシートから読み込んで動的に変更されます） -->
          <span id="board-title-display">塩瀬中ポータル連絡掲示板</span>
        </h1>
      </div>
      
      <div class="flex flex-wrap items-center gap-1.5 self-end sm:self-auto">
        <!-- 新規作成ボタン -->
        <button onclick="openCreateForm()" class="flex items-center gap-1 px-2.5 py-1 text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition shadow-sm">
          <i data-lucide="plus" class="w-3 h-3"></i>
          <span>新規作成</span>
        </button>

        <!-- 掲示板設定ボタン（統合版ポップアップを開く） -->
        <button onclick="openSettingsModal()" class="flex items-center gap-1 px-2.5 py-1 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition border border-slate-200" title="掲示板の名前やカテゴリを管理します">
          <i data-lucide="settings" class="w-3 h-3"></i>
          <span>掲示板設定</span>
        </button>
        
        <!-- コピーボタン -->
        <button onclick="generateMorningMail()" class="flex items-center gap-1 px-2.5 py-1 text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg transition shadow-sm">
          <i data-lucide="mail" class="w-3 h-3"></i>
          <span>コピー</span>
        </button>
      </div>
    </header>

    <!-- 日付切り替えとカテゴリフィルター -->
    <section class="bg-white p-3 rounded-lg shadow-sm border border-slate-100 mb-3 flex flex-col md:flex-row gap-4 items-center justify-between">
      
      <!-- 横幅拡張・太字強化された表示日切り替えコントロール -->
      <div class="flex items-center gap-2 w-full md:w-auto">
        <div class="flex items-center gap-1 bg-slate-100 p-1.5 rounded-lg border border-slate-200">
          <button onclick="changeDisplayDate(-1)" class="p-1.5 hover:bg-white rounded transition text-slate-700 hover:text-slate-900" title="前日へ">
            <i data-lucide="chevron-left" class="w-4.5 h-4.5" style="stroke-width: 3px;"></i>
          </button>
          <input type="date" id="display-date-filter" onchange="handleDisplayDateChange()" class="px-2 py-1 border-0 focus:ring-0 text-sm bg-transparent text-center w-[165px] focus:outline-none font-extrabold text-slate-900">
          <button onclick="changeDisplayDate(1)" class="p-1.5 hover:bg-white rounded transition text-slate-700 hover:text-slate-900" title="翌日へ">
            <i data-lucide="chevron-right" class="w-4.5 h-4.5" style="stroke-width: 3px;"></i>
          </button>
        </div>
        <button onclick="resetDisplayDateToToday()" id="today-reset-btn" class="px-3.5 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-extrabold rounded-lg transition border border-blue-200 whitespace-nowrap hidden ml-1 shadow-sm">
          今日
        </button>
      </div>
      
      <div id="filter-buttons-container" class="flex flex-wrap gap-1.5 w-full md:w-auto md:justify-end">
        <!-- JSで動的にカテゴリフィルターボタンが追加されます -->
      </div>
    </section>

    <!-- 掲示板一覧表示エリア -->
    <div id="posts-container" class="space-y-2">
      <!-- JavaScriptで動的に追加されます -->
    </div>

    <!-- 投稿がない場合のプレースホルダー -->
    <div id="no-posts" class="hidden bg-white p-6 text-center rounded-lg border border-slate-100 shadow-sm">
      <i data-lucide="inbox" class="w-8 h-8 text-slate-300 mx-auto mb-1.5"></i>
      <p class="text-slate-500 text-[11px] font-medium" id="no-posts-text">現在、表示中のお知らせはありません。</p>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 📌 ポップアップ（モーダル）エリア            -->
  <!-- ========================================== -->

  <!-- 1. 新規作成・編集モーダル -->
  <div id="create-post-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 hidden">
    <div class="bg-white p-4 rounded-lg shadow-xl max-w-xl w-full mx-4 border border-slate-100 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
        <h2 class="text-xs font-bold text-slate-900 flex items-center gap-1">
          <i data-lucide="edit-3" class="text-blue-600 w-3.5 h-3.5"></i> <span id="form-title">新しい連絡事項を作成</span>
        </h2>
        <button onclick="closeCreateForm()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      
      <form id="post-form" onsubmit="handleFormSubmit(event)" class="space-y-3">
        <input type="hidden" id="edit-id">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-2.5">
          <!-- タイトル -->
          <div class="md:col-span-2">
            <label class="block text-[9px] font-bold text-slate-700 uppercase mb-0.5">タイトル <span class="text-red-500">*</span></label>
            <input type="text" id="post-title" required placeholder="件名を入力してください" class="w-full px-2.5 py-1 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs">
          </div>
          <!-- カテゴリ複数選択（チェックボックス式） -->
          <div>
            <label class="block text-[9px] font-bold text-slate-700 uppercase mb-1">分類（複数選択可） <span class="text-red-500">*</span></label>
            <div id="post-categories-checkboxes" class="border border-slate-200 rounded-lg p-2 max-h-24 overflow-y-auto bg-white space-y-1.5 text-xs">
              <!-- JSでカテゴリ一覧のチェックボックス群を自動出力 -->
            </div>
          </div>
        </div>

        <!-- 本文 -->
        <div>
          <label class="block text-[9px] font-bold text-slate-700 uppercase mb-0.5">内容 <span class="text-red-500">*</span></label>
          <textarea id="post-content" required rows="4" placeholder="詳細な内容を記入してください" class="w-full px-2.5 py-1 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs"></textarea>
        </div>

        <!-- 掲載期間設定 & ピン留めチェック -->
        <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-100 space-y-2">
          <div>
            <h3 class="text-[9px] font-bold text-slate-700 uppercase mb-1 flex items-center gap-1">
              <i data-lucide="calendar" class="w-2.5 h-2.5"></i> 掲載期間の設定 (任意：空欄にするとその日のみ表示)
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
              <div>
                <label class="block text-[9px] text-slate-500 mb-0.5">掲載開始日</label>
                <input type="date" id="post-start" class="w-full px-2 py-0.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs bg-white">
              </div>
              <div>
                <label class="block text-[9px] text-slate-500 mb-0.5">掲載終了日</label>
                <input type="date" id="post-end" class="w-full px-2 py-0.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs bg-white">
              </div>
            </div>
          </div>

          <!-- 最上部ピン留めチェックボックス -->
          <div class="flex items-center gap-1.5 pt-1.5 border-t border-slate-200/60">
            <input type="checkbox" id="post-pinned" class="w-3 h-3 text-blue-600 border-slate-300 rounded focus:ring-blue-500 cursor-pointer">
            <label for="post-pinned" class="text-[11px] text-slate-700 font-semibold select-none flex items-center gap-1 cursor-pointer">
              <i data-lucide="pin" class="w-2.5 h-2.5 text-blue-600 fill-current"></i> この連絡を最上部にピン留め（固定）する
            </label>
          </div>
        </div>

        <!-- 送信ボタン -->
        <div class="flex justify-end gap-1.5 pt-1">
          <button type="button" onclick="closeCreateForm()" class="px-3 py-1 border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-lg font-medium text-xs transition">
            閉じる
          </button>
          <button id="submit-post-btn" type="submit" class="px-3.5 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium text-xs transition flex items-center gap-1 shadow-sm">
            <i data-lucide="send" class="w-3 h-3" id="submit-icon"></i> <span id="submit-btn-text">お知らせを掲載する</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. 掲示板設定（統合ポップアップ）モーダル -->
  <div id="settings-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 hidden">
    <div class="bg-white p-4 rounded-lg shadow-xl max-w-lg w-full mx-4 border border-slate-100 max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
        <h2 class="text-xs font-bold text-slate-900 flex items-center gap-1.5">
          <i data-lucide="settings" class="text-slate-600 w-4 h-4"></i> 掲示板設定・管理
        </h2>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- セクションA: 掲示板の名前（タイトル）設定 -->
      <div class="mb-5 bg-slate-50 p-3 rounded-lg border border-slate-100">
        <h3 class="text-[10px] font-bold text-slate-700 uppercase mb-2 flex items-center gap-1">
          <i data-lucide="type" class="w-3 h-3 text-blue-600"></i> 掲示板の名前変更（全体同期）
        </h3>
        <form onsubmit="handleTitleUpdate(event)" class="flex gap-2">
          <input type="text" id="setting-board-title" required placeholder="例: 塩瀬中ポータル連絡掲示板" class="flex-1 px-3 py-1 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs font-bold bg-white">
          <button id="save-title-btn" type="submit" class="px-3.5 py-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs rounded-lg transition shadow-sm whitespace-nowrap">
            名前を保存
          </button>
        </form>
      </div>

      <!-- セクションB: カテゴリ（分類）の設定・管理 -->
      <div class="border-t border-slate-100 pt-3">
        <h3 class="text-[10px] font-bold text-slate-700 uppercase mb-2 flex items-center gap-1">
          <i data-lucide="sliders" class="w-3 h-3 text-slate-600"></i> カテゴリ（分類）の追加・削除
        </h3>
        
        <!-- カテゴリ追加サブフォーム -->
        <form id="category-form" onsubmit="handleAddCategory(event)" class="grid grid-cols-1 md:grid-cols-4 gap-2 mb-3 items-end bg-slate-50 p-2.5 rounded-lg border border-slate-100">
          <div class="md:col-span-2">
            <label class="block text-[9px] font-bold text-slate-600 mb-0.5">カテゴリ名 <span class="text-red-500">*</span></label>
            <input type="text" id="new-category-name" required placeholder="例: 重要、学年連絡" class="w-full px-3 py-1 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs bg-white">
          </div>
          <div>
            <label class="block text-[9px] font-bold text-slate-600 mb-0.5">カラー <span class="text-red-500">*</span></label>
            <select id="new-category-color" required class="w-full px-3 py-1 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs bg-white">
              <option value="red">🔴 レッド</option>
              <option value="blue" selected>🔵 ブルー</option>
              <option value="emerald">🟢 エメラルド</option>
              <option value="amber">🟡 アンバー</option>
              <option value="purple">🟣 パープル</option>
              <option value="pink">🌸 ピンク</option>
              <option value="slate">⚫ グレー</option>
            </select>
          </div>
          <button id="add-category-btn" type="submit" class="w-full px-2.5 py-1.5 bg-slate-800 hover:bg-slate-900 text-white rounded-lg font-medium text-xs transition flex items-center justify-center gap-1">
            <i data-lucide="plus-circle" class="w-3 h-3"></i> 追加
          </button>
        </form>

        <div class="mb-2">
          <h4 class="text-[9px] font-bold text-slate-500 mb-1.5 uppercase">登録中のカテゴリ一覧</h4>
          <div id="settings-categories-list" class="flex flex-wrap gap-1.5">
            <!-- JSで一覧描画 -->
          </div>
        </div>
      </div>

      <div class="flex justify-end pt-3 border-t border-slate-100 mt-4">
        <button onclick="closeSettingsModal()" class="px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition">
          閉じる
        </button>
      </div>
    </div>
  </div>

  <!-- 3. メール送信用テキストプレビューモーダル -->
  <div id="mail-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 hidden">
    <div class="bg-white p-4 rounded-lg shadow-xl max-w-lg w-full mx-4 border border-slate-100 flex flex-col max-h-[85vh]">
      <div class="flex justify-between items-center mb-1.5">
        <h3 class="text-xs font-bold text-slate-900 flex items-center gap-1">
          <i data-lucide="mail-check" class="text-emerald-600 w-3.5 h-3.5"></i> 朝の配信用メール作成
        </h3>
        <button onclick="closeMailModal()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <p class="text-[10px] text-slate-500 mb-2">本日掲載中のお知らせをメール用に整形しました。コピーしてお使いください。</p>
      <textarea id="mail-content-text" readonly class="w-full flex-1 p-2.5 border border-slate-200 rounded-lg text-xs font-mono bg-slate-50 text-slate-700 h-64 focus:outline-none"></textarea>
      <div class="flex justify-end gap-1.5 mt-3">
        <button onclick="closeMailModal()" class="px-3 py-1 border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs rounded-lg transition">閉じる</button>
        <button onclick="copyMailTextToClipboard()" class="px-3.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs rounded-lg font-semibold transition flex items-center gap-1">
          <i data-lucide="copy" class="w-2.5 h-2.5"></i> コピーする
        </button>
      </div>
    </div>
  </div>

  <!-- 4. 通知トースト -->
  <div id="toast" class="fixed bottom-4 right-4 bg-slate-900 text-white text-xs px-3.5 py-2 rounded-lg shadow-lg flex items-center gap-1.5 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
    <i data-lucide="check-circle-2" class="text-emerald-400 w-3.5 h-3.5"></i>
    <span id="toast-message">メッセージ</span>
  </div>

  <!-- 5. カスタム確認モーダル -->
  <div id="custom-alert" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 hidden">
    <div class="bg-white p-4 rounded-lg shadow-xl max-w-sm w-full mx-4 border border-slate-100">
      <h3 class="text-xs font-bold text-slate-900 mb-0.5" id="alert-title">確認</h3>
      <p class="text-slate-600 text-[11px] mb-3" id="alert-message">内容</p>
      <div class="flex justify-end gap-1">
        <button id="alert-cancel-btn" class="px-2.5 py-1 border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs rounded-lg transition">キャンセル</button>
        <button id="alert-confirm-btn" class="px-2.5 py-1 bg-blue-600 hover:bg-blue-700 text-white text-xs rounded-lg transition">OK</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // ⚠️ Googleドライブ（GAS）連携設定：ここにデプロイ後のウェブアプリURLを入力します
    // =========================================================================
    // 設定手順書（gas_setup.md）に沿って取得したGASウェブアプリURLをここに貼り付けてください。
    // スプレッドシート連携APIを介して、完全なクラウド共有状態で掲示板が動作するようになります。
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzqzFH_0felNRjFU8SQ0PG2VzX8iBB9CD-iDRVmm-PTxEuwl3h9WfFClYkXKqOHWR9O7A/exec";

    // グローバル状態管理
    let posts = [];
    let categories = [];
    let currentCategoryFilter = 'all';
    let selectedDisplayDate = "";

    // ==========================================
    // 📢 ユーティリティ・表示系関数群（最優先定義）
    // ==========================================
    
    // 通知トースト
    function showToast(message) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      document.getElementById('toast-message').innerText = message;
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }
    window.showToast = showToast;

    // 接続状態インジケーターの更新
    function updateStatus(text, colorClass) {
      const dot = document.getElementById('status-dot');
      const label = document.getElementById('status-text');
      if (dot && label) {
        dot.className = `inline-block w-2 h-2 rounded-full ${colorClass}`;
        label.innerText = text;
      }
    }
    window.updateStatus = updateStatus;

    // 確認ダイアログ
    function showConfirm(title, message, onConfirm) {
      const alertModal = document.getElementById('custom-alert');
      if (!alertModal) return;
      document.getElementById('alert-title').innerText = title;
      document.getElementById('alert-message').innerText = message;
      const confirmBtn = document.getElementById('alert-confirm-btn');
      const cancelBtn = document.getElementById('alert-cancel-btn');
      
      alertModal.classList.remove('hidden');
      confirmBtn.onclick = function() {
        alertModal.classList.add('hidden');
        onConfirm();
      };
      cancelBtn.onclick = function() { alertModal.classList.add('hidden'); };
    }
    window.showConfirm = showConfirm;

    // スプレッドシートからの日付データを安全にYYYY-MM-DDにクレンジングする補助関数
    function normalizeDateStr(dateInput) {
      if (!dateInput) return "";
      const d = new Date(dateInput);
      if (isNaN(d.getTime())) return "";
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    // 初期起動
    window.onload = function() {
      const today = new Date();
      selectedDisplayDate = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      
      const dateFilterInput = document.getElementById('display-date-filter');
      if (dateFilterInput) dateFilterInput.value = selectedDisplayDate;

      lucide.createIcons();

      // GASウェブアプリURLの有無を厳密にチェック
      if (GAS_WEB_APP_URL && GAS_WEB_APP_URL !== "") {
        fetchDataFromGAS();
      } else {
        updateStatus("未同期（URL未設定） 🔴", "bg-red-500 animate-none");
        showToast("連携設定エラー：手順書を参考に「GAS_WEB_APP_URL」を入力して公開してください。");
      }
    };

    // --- GAS（Googleドライブ）とのAPI通信処理 ---
    async function apiRequestToGAS(action, payload = {}) {
      updateStatus("通信中...", "bg-amber-400");
      
      try {
        const bodyData = { action, ...payload };
        const response = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          mode: "cors",
          headers: {
            "Content-Type": "text/plain"
          },
          body: JSON.stringify(bodyData)
        });

        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        
        if (data.success) {
          updateStatus("同期中 🟢", "bg-emerald-500");
          return data;
        } else {
          throw new Error(data.error || "GAS処理エラー");
        }
      } catch (err) {
        updateStatus("通信エラー 🔴", "bg-red-500");
        showToast("ドライブデータベースとの通信に失敗しました。接続設定を確認してください。");
        return { success: false, error: err.message };
      }
    }

    // ドライブからデータ全取得
    async function fetchDataFromGAS() {
      const result = await apiRequestToGAS("readAll");
      if (result && result.success) {
        posts = result.posts || [];
        categories = result.categories || [];
        
        // クラウド側から動的に掲示板の名前を読み込んで反映
        if (result.config) {
          const titleObj = result.config.find(c => c.key === "board_title");
          if (titleObj && titleObj.value) {
            document.getElementById('board-title-display').innerText = titleObj.value;
            document.getElementById('setting-board-title').value = titleObj.value;
          }
        }
        
        initCategoryControls();
        renderBoard();
      }
    }
    window.fetchDataFromGAS = fetchDataFromGAS;

    function refreshBoardData() {
      if (GAS_WEB_APP_URL && GAS_WEB_APP_URL !== "") {
        fetchDataFromGAS();
      } else {
        showToast("通信エラー：GAS_WEB_APP_URLが設定されていません。");
      }
    }
    window.refreshBoardData = refreshBoardData;

    // ==========================================
    // 🎛️ モーダル操作ウインドウ制御
    // ==========================================
    
    // 新規作成・編集モーダル
    function openCreateForm() {
      document.getElementById('edit-id').value = '';
      document.getElementById('form-title').innerText = "新しい連絡事項を作成";
      document.getElementById('submit-btn-text').innerText = "お知らせを掲載する";
      document.getElementById('post-form').reset();
      document.getElementById('post-pinned').checked = false;
      document.querySelectorAll('.category-checkbox').forEach(cb => cb.checked = false);
      
      document.getElementById('create-post-modal').classList.remove('hidden');
      document.getElementById('post-title').focus();
    }
    window.openCreateForm = openCreateForm;

    function closeCreateForm() {
      document.getElementById('create-post-modal').classList.add('hidden');
    }
    window.closeCreateForm = closeCreateForm;

    // 掲示板設定・統合モーダル
    function openSettingsModal() {
      // 現在表示されている名前をフォームの初期値としてセット
      const currentTitle = document.getElementById('board-title-display').innerText;
      document.getElementById('setting-board-title').value = currentTitle;

      document.getElementById('settings-modal').classList.remove('hidden');
    }
    window.openSettingsModal = openSettingsModal;

    function closeSettingsModal() {
      document.getElementById('settings-modal').classList.add('hidden');
    }
    window.closeSettingsModal = closeSettingsModal;

    // ==========================================
    // 💾 データ操作処理（GAS同期）
    // ==========================================

    // 掲示板の名前（タイトル）変更
    async function handleTitleUpdate(e) {
      e.preventDefault();
      const newTitle = document.getElementById('setting-board-title').value.trim();
      if (!newTitle) return;

      document.getElementById('save-title-btn').disabled = true;

      const result = await apiRequestToGAS("updateConfig", { key: "board_title", value: newTitle });
      if (result && result.success) {
        document.getElementById('board-title-display').innerText = newTitle;
        showToast("掲示板の名前を保存し、全体へ同期しました！");
      }

      document.getElementById('save-title-btn').disabled = false;
    }
    window.handleTitleUpdate = handleTitleUpdate;

    // 投稿登録・編集
    async function handleFormSubmit(e) {
      e.preventDefault();
      
      const editId = document.getElementById('edit-id').value;
      const title = document.getElementById('post-title').value;
      const content = document.getElementById('post-content').value;
      let start = document.getElementById('post-start').value;
      const end = document.getElementById('post-end').value;
      const pinned = document.getElementById('post-pinned').checked;

      const selectedCats = [];
      document.querySelectorAll('.category-checkbox:checked').forEach(cb => {
        selectedCats.push(cb.value);
      });

      if (selectedCats.length === 0) {
        showToast("分類を少なくとも1つ選択してください。");
        return;
      }

      // 💡 掲載開始日が未入力かつ掲載終了日が入力されている場合、本日（当日）の日付を設定
      if (!start && end) {
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const d = String(today.getDate()).padStart(2, '0');
        start = `${y}-${m}-${d}`;
      }

      const postData = {
        title,
        content,
        categories: selectedCats.join(','), // ドライブ（GAS）保存用にCSV文字列として定義
        start,
        end,
        pinned: pinned ? "TRUE" : "FALSE"
      };

      document.getElementById('submit-post-btn').disabled = true;

      let result;
      if (editId) {
        result = await apiRequestToGAS("updatePost", { id: editId, ...postData });
      } else {
        result = await apiRequestToGAS("createPost", postData);
      }

      if (result && result.success) {
        posts = result.posts || [];
        categories = result.categories || [];
        closeCreateForm();
        renderBoard();
        showToast(editId ? "お知らせを更新しました！" : "新しくお知らせを追加しました！");
      }

      document.getElementById('submit-post-btn').disabled = false;
    }
    window.handleFormSubmit = handleFormSubmit;

    // 編集フォーム展開
    function editPost(id) {
      const post = posts.find(p => p.id === id);
      if (!post) return;

      document.getElementById('edit-id').value = post.id;
      document.getElementById('post-title').value = post.title;
      document.getElementById('post-content').value = post.content;
      document.getElementById('post-start').value = normalizeDateStr(post.start) || '';
      document.getElementById('post-end').value = normalizeDateStr(post.end) || '';
      document.getElementById('post-pinned').checked = (post.pinned === "TRUE");

      const rawCategories = post.categories || "";
      const postCats = rawCategories.split(',').map(c => c.trim()).filter(Boolean);
      document.querySelectorAll('.category-checkbox').forEach(cb => {
        cb.checked = postCats.includes(cb.value);
      });

      document.getElementById('form-title').innerText = "お知らせを編集";
      document.getElementById('submit-btn-text').innerText = "更新する";

      document.getElementById('create-post-modal').classList.remove('hidden');
    }
    window.editPost = editPost;

    function confirmDeletePost(id) {
      showConfirm("投稿の削除", "このお知らせを一覧から削除してもよろしいですか？\nこの操作は戻せません。", async () => {
        const result = await apiRequestToGAS("deletePost", { id });
        if (result && result.success) {
          posts = result.posts || [];
          categories = result.categories || [];
          renderBoard();
          showToast("お知らせを削除しました。");
        }
      });
    }
    window.confirmDeletePost = confirmDeletePost;

    async function togglePin(id) {
      const post = posts.find(p => p.id === id);
      if (!post) return;
      const isCurrentlyPinned = post.pinned === "TRUE" || post.pinned === true;
      const nextPinnedState = isCurrentlyPinned ? "FALSE" : "TRUE";

      const result = await apiRequestToGAS("togglePinPost", { id, pinned: nextPinnedState });
      if (result && result.success) {
        posts = result.posts || [];
        categories = result.categories || [];
        renderBoard();
        showToast(nextPinnedState === "TRUE" ? "最上部に固定しました" : "固定を解除しました");
      }
    }
    window.togglePin = togglePin;

    // カテゴリ追加
    async function handleAddCategory(e) {
      e.preventDefault();
      const nameInput = document.getElementById('new-category-name');
      const colorSelect = document.getElementById('new-category-color');
      const name = nameInput.value.trim();
      const color = colorSelect.value;

      if (!name) return;
      if (categories.some(cat => cat.name.toLowerCase() === name.toLowerCase())) {
        showToast("すでに同じ名前のカテゴリが存在します。");
        return;
      }

      document.getElementById('add-category-btn').disabled = true;

      const result = await apiRequestToGAS("createCategory", { name, color });
      if (result && result.success) {
        posts = result.posts || [];
        categories = result.categories || [];
        nameInput.value = '';
        initCategoryControls();
        renderBoard();
        showToast(`カテゴリ「${name}」を追加しました。`);
      }

      document.getElementById('add-category-btn').disabled = false;
    }
    window.handleAddCategory = handleAddCategory;

    // カテゴリ削除
    function deleteCategory(id) {
      const targetCat = categories.find(cat => cat.id === id);
      if (!targetCat) return;
      if (categories.length <= 1) {
        showToast("カテゴリは最低1つ残す必要があります。");
        return;
      }

      showConfirm("カテゴリの削除", `カテゴリ「${targetCat.name}」を削除しますか？\n削除した場合、このカテゴリに属する既存の投稿は、自動的に他の有効な代替カテゴリに移行されます。`, async () => {
        const result = await apiRequestToGAS("deleteCategory", { id });
        if (result && result.success) {
          posts = result.posts || [];
          categories = result.categories || [];
          if (currentCategoryFilter === targetCat.name) {
            currentCategoryFilter = 'all';
          }
          initCategoryControls();
          renderBoard();
          showToast("カテゴリを削除しました。");
        }
      });
    }
    window.deleteCategory = deleteCategory;

    // ==========================================
    // 🎨 UI・レンダリング制御
    // ==========================================

    function initCategoryControls() {
      // フォーム内チェックボックス群
      const checkboxContainer = document.getElementById('post-categories-checkboxes');
      if (checkboxContainer) {
        checkboxContainer.innerHTML = '';
        categories.forEach(cat => {
          const div = document.createElement('div');
          div.className = "flex items-center gap-1.5 cursor-pointer";
          div.innerHTML = `
            <input type="checkbox" id="check-${cat.id}" value="${cat.name}" class="category-checkbox w-3.5 h-3.5 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer">
            <label for="check-${cat.id}" class="select-none cursor-pointer text-slate-700 font-medium">${escapeHtml(cat.name)}</label>
          `;
          checkboxContainer.appendChild(div);
        });
      }

      // 上部メインフィルターボタン群
      const filterContainer = document.getElementById('filter-buttons-container');
      if (filterContainer) {
        filterContainer.innerHTML = '';
        const allBtn = document.createElement('button');
        allBtn.onclick = () => filterCategory('all');
        allBtn.className = `category-filter-btn px-2.5 py-0.5 rounded-full text-[11px] font-semibold ${currentCategoryFilter === 'all' ? 'bg-blue-600 text-white shadow-sm' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'} transition`;
        allBtn.innerText = 'すべて';
        allBtn.setAttribute('data-category', 'all');
        filterContainer.appendChild(allBtn);

        categories.forEach(cat => {
          const btn = document.createElement('button');
          btn.onclick = () => filterCategory(cat.name);
          btn.className = `category-filter-btn px-2.5 py-0.5 rounded-full text-[11px] font-semibold ${currentCategoryFilter === cat.name ? 'bg-blue-600 text-white shadow-sm' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'} transition`;
          btn.innerText = cat.name;
          btn.setAttribute('data-category', cat.name);
          filterContainer.appendChild(btn);
        });
      }

      // モーダル内一覧
      const settingsList = document.getElementById('settings-categories-list');
      if (settingsList) {
        settingsList.innerHTML = '';
        categories.forEach(cat => {
          const colorClasses = getBadgeColorClasses(cat.color);
          const item = document.createElement('div');
          item.className = `flex items-center gap-1 px-2 py-0.5 rounded-lg text-[10px] font-medium border ${colorClasses}`;
          item.innerHTML = `
            <span>${escapeHtml(cat.name)}</span>
            <button type="button" onclick="deleteCategory('${cat.id}')" class="text-slate-400 hover:text-red-500 transition ml-0.5" title="削除">
              <i data-lucide="x-circle" class="w-3 h-3"></i>
            </button>
          `;
          settingsList.appendChild(item);
        });
      }
      lucide.createIcons();
    }

    function renderBoard() {
      const container = document.getElementById('posts-container');
      if (!container) return;
      container.innerHTML = '';
      let visibleCount = 0;

      // 日付フィルタリング
      const baseDate = new Date(selectedDisplayDate + "T12:00:00");
      const activePosts = posts.filter(post => {
        const createdDate = new Date(post.createdAt);
        const createdDateStr = `${createdDate.getFullYear()}-${String(createdDate.getMonth() + 1).padStart(2, '0')}-${String(createdDate.getDate()).padStart(2, '0')}`;
        
        // スプレッドシートからの時間ズレ日付文字列をYYYY-MM-DDへ正規化
        const effectiveStart = normalizeDateStr(post.start) || createdDateStr;
        const effectiveEnd = normalizeDateStr(post.end) || createdDateStr;

        const startDate = new Date(effectiveStart + "T00:00:00");
        const endDate = new Date(effectiveEnd + "T23:59:59");

        return (baseDate >= startDate && baseDate <= endDate);
      });

      // ピン留め優先ソート
      const sortedPosts = [...activePosts].sort((a, b) => {
        const aPinned = a.pinned === "TRUE" || a.pinned === true;
        const bPinned = b.pinned === "TRUE" || b.pinned === true;
        if (aPinned && !bPinned) return -1;
        if (!aPinned && bPinned) return 1;
        return new Date(b.createdAt) - new Date(a.createdAt);
      });

      sortedPosts.forEach(post => {
        const rawCategories = post.categories || "";
        const postCats = rawCategories.split(',').map(c => c.trim()).filter(Boolean);
        if (currentCategoryFilter !== 'all' && !postCats.includes(currentCategoryFilter)) return;

        visibleCount++;
        let badgesHtml = '';
        postCats.forEach(catName => {
          const categoryData = categories.find(c => c.name === catName);
          const badgeColor = categoryData ? getBadgeColorClasses(categoryData.color) : 'bg-slate-100 text-slate-700 border-slate-200';
          badgesHtml += `<span class="px-1.5 py-0.5 rounded font-bold ${badgeColor} mr-1">${escapeHtml(catName)}</span>`;
        });

        const createdDateStr = formatOnlyDate(post.createdAt);
        const normStart = normalizeDateStr(post.start);
        const normEnd = normalizeDateStr(post.end);
        const periodText = (!normStart && !normEnd) ? `${createdDateStr.replace(/\//g, '-')} (当日のみ)` : `${normStart || createdDateStr.replace(/\//g, '-')} 〜 ${normEnd || createdDateStr.replace(/\//g, '-')}`;
        const isPinned = (post.pinned === "TRUE" || post.pinned === true);

        const card = document.createElement('article');
        card.className = `bg-white p-3 rounded-lg shadow-sm border transition-all hover:shadow relative overflow-hidden ${isPinned ? 'border-l-4 border-l-blue-500 bg-blue-50/10' : 'border-slate-100'}`;
        card.innerHTML = `
          <div class="flex flex-wrap items-center gap-x-2 gap-y-1 mb-1.5 text-[10px]">
            <div class="flex flex-wrap gap-y-0.5">${badgesHtml}</div>
            <span class="text-slate-400 flex items-center gap-0.5"><i data-lucide="calendar" class="w-2.5 h-2.5"></i> ${periodText}</span>
            <div class="ml-auto flex gap-1 items-center">
              <button onclick="togglePin('${post.id}')" class="transition px-1 py-0.5 rounded flex items-center gap-0.5 ${isPinned ? 'text-blue-600 bg-blue-50 font-bold' : 'text-slate-400 hover:text-blue-600'}">
                <i data-lucide="pin" class="w-2.5 h-2.5 ${isPinned ? 'fill-current' : ''}"></i> ${isPinned ? '固定中' : '固定'}
              </button>
              <button onclick="editPost('${post.id}')" class="text-slate-400 hover:text-blue-600 transition px-1 py-0.5 rounded flex items-center gap-0.5"><i data-lucide="edit" class="w-2.5 h-2.5"></i> 変更</button>
              <button onclick="confirmDeletePost('${post.id}')" class="text-slate-300 hover:text-red-500 transition px-1.5 py-0.5 rounded flex items-center gap-0.5"><i data-lucide="trash-2" class="w-2.5 h-2.5"></i> 削除</button>
            </div>
          </div>
          <h3 class="text-sm font-bold text-slate-900 mb-1 leading-snug flex items-center gap-1">
            ${isPinned ? '<i data-lucide="pin" class="w-3.5 h-3.5 text-blue-500 fill-current shrink-0"></i>' : ''} ${escapeHtml(post.title)}
          </h3>
          <p class="text-slate-600 text-[11px] whitespace-pre-wrap leading-snug border-t border-slate-50 pt-1.5 mt-1">${escapeHtml(post.content)}</p>
        `;
        container.appendChild(card);
      });

      lucide.createIcons();
      const noPostsEl = document.getElementById('no-posts');
      if (visibleCount === 0) {
        if (noPostsEl) {
          noPostsEl.classList.remove('hidden');
          document.getElementById('no-posts-text').innerText = `${selectedDisplayDate} 時点に表示対象のお知らせはありません。`;
        }
      } else {
        if (noPostsEl) noPostsEl.classList.add('hidden');
      }
    }

    // カレンダー操作
    function changeDisplayDate(offset) {
      const currentDate = new Date(selectedDisplayDate + "T12:00:00");
      currentDate.setDate(currentDate.getDate() + offset);
      selectedDisplayDate = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(currentDate.getDate()).padStart(2, '0')}`;
      document.getElementById('display-date-filter').value = selectedDisplayDate;
      updateTodayBtnVisibility();
      renderBoard();
    }
    window.changeDisplayDate = changeDisplayDate;

    function handleDisplayDateChange() {
      selectedDisplayDate = document.getElementById('display-date-filter').value;
      updateTodayBtnVisibility();
      renderBoard();
    }
    window.handleDisplayDateChange = handleDisplayDateChange;

    function resetDisplayDateToToday() {
      const today = new Date();
      selectedDisplayDate = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      document.getElementById('display-date-filter').value = selectedDisplayDate;
      document.getElementById('today-reset-btn').classList.add('hidden');
      renderBoard();
      showToast("今日にリセットしました");
    }
    window.resetDisplayDateToToday = resetDisplayDateToToday;

    function updateTodayBtnVisibility() {
      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      const resetBtn = document.getElementById('today-reset-btn');
      if (resetBtn) {
        if (selectedDisplayDate !== todayStr) resetBtn.classList.remove('hidden');
        else resetBtn.classList.add('hidden');
      }
    }

    function filterCategory(category) {
      currentCategoryFilter = category;
      document.querySelectorAll('.category-filter-btn').forEach(btn => {
        if (btn.getAttribute('data-category') === category) {
          btn.className = "category-filter-btn px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-blue-600 text-white transition shadow-sm";
        } else {
          btn.className = "category-filter-btn px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 transition";
        }
      });
      renderBoard();
    }
    window.filterCategory = filterCategory;

    // 朝礼配信テキスト生成
    function generateMorningMail() {
      const baseDate = new Date(selectedDisplayDate + "T12:00:00");
      const activePosts = posts.filter(post => {
        const createdDate = new Date(post.createdAt);
        const createdDateStr = `${createdDate.getFullYear()}-${String(createdDate.getMonth() + 1).padStart(2, '0')}-${String(createdDate.getDate()).padStart(2, '0')}`;
        
        const normStart = normalizeDateStr(post.start) || createdDateStr;
        const normEnd = normalizeDateStr(post.end) || createdDateStr;

        return (baseDate >= new Date(normStart + "T00:00:00") && baseDate <= new Date(normEnd + "T23:59:59"));
      });

      const sortedPosts = [...activePosts].sort((a, b) => {
        const aPinned = a.pinned === "TRUE" || a.pinned === true;
        const bPinned = b.pinned === "TRUE" || b.pinned === true;
        if (aPinned && !bPinned) return -1;
        if (!aPinned && bPinned) return 1;
        return new Date(b.createdAt) - new Date(a.createdAt);
      });

      if (sortedPosts.length === 0) {
        showToast("対象の連絡がありません。");
        return;
      }

      const dParts = selectedDisplayDate.split('-');
      let mailText = `件名: 【朝礼・連絡】お知らせ連絡（${dParts[0]}年${parseInt(dParts[1])}月${parseInt(dParts[2])}日分）\n`;
      mailText += `-----------------------------------------------\n▼ 本日の連絡事項：計 ${sortedPosts.length} 件\n-----------------------------------------------\n\n`;

      sortedPosts.forEach((post, i) => {
        const rawCategories = post.categories || "";
        const isPinned = (post.pinned === "TRUE" || post.pinned === true);
        mailText += `[${i + 1}] ${isPinned ? "★[固定] " : ""}【${rawCategories}】 ${post.title}\n`;
        const spacedContent = post.content.split('\n').map(line => `  ${line}`).join('\n');
        mailText += `${spacedContent}\n\n`;
      });

      document.getElementById('mail-content-text').value = mailText;
      document.getElementById('mail-modal').classList.remove('hidden');
    }
    window.generateMorningMail = generateMorningMail;

    function closeMailModal() { document.getElementById('mail-modal').classList.add('hidden'); }
    window.closeMailModal = closeMailModal;

    // クリップボードへのメールコピー
    function copyMailTextToClipboard() {
      const textarea = document.getElementById('mail-content-text');
      textarea.select();
      try {
        document.execCommand('copy');
        closeMailModal();
        showToast("メール本文をクリップボードにコピーしました！");
      } catch (err) { showToast("コピーに失敗しました。"); }
    }
    window.copyMailTextToClipboard = copyMailTextToClipboard;

    function getBadgeColorClasses(colorName) {
      switch(colorName) {
        case 'red': return 'bg-red-50 text-red-700 border-red-100';
        case 'blue': return 'bg-blue-50 text-blue-700 border-blue-100';
        case 'emerald': return 'bg-emerald-50 text-emerald-700 border-emerald-100';
        case 'amber': return 'bg-amber-50 text-amber-700 border-amber-100';
        case 'purple': return 'bg-purple-50 text-purple-700 border-purple-100';
        case 'pink': return 'bg-pink-50 text-pink-700 border-pink-100';
        default: return 'bg-slate-100 text-slate-700 border-slate-200';
      }
    }

    function formatOnlyDate(dateStr) {
      const date = new Date(dateStr);
      return `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')}`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
    }
  </script>
</body>
